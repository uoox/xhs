[package]
name = "xhs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "小红书命令行工具：借用户已登录 Chrome 页面自己的接口封装调用，签名全由页面计算"
repository = "https://github.com/uoox/xhs"
readme = "README.md"

[[bin]]
name = "xhs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
